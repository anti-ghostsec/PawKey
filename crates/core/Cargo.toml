[package]
name = "pawkey-core"
description = "PawKey's insides: TOTP codes, otpauth links, QR codes and the password-sealed vault"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vaultkit.workspace = true
zeroize.workspace = true
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rqrr = "0.9"
pbkdf2 = "0.12"
aes-gcm = "0.10"
base64 = "0.22"

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
